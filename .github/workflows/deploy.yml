# Builds the site with the shared SciTech build (LambdaIITH/scitech-hosting) and publishes it to the `deploy`
# branch, which Lambda's server serves at https://elektronica.iith.dev. Pull requests only get the build, as a check.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: LambdaIITH/scitech-hosting/.github/workflows/build.yml@main
    permissions:
      contents: write # to publish the build to the deploy branch
    with:
      url: https://elektronica.iith.dev/
      hugo: 0.85.0
      node: "22" # npm ci first: the CSS is built with PostCSS and Tailwind
